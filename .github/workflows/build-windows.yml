name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup MSBuild and add to PATH
        uses: microsoft/setup-msbuild@v1.0.0
        id: setup_msbuild
              
      - name: Run MSBuild
        id: run_msbuild
        run: |
          msbuild .\GMLoader\GMLoader.sln  /t:clean /p:Configuration=Debug
          nuget restore .\GMLoader\GMLoader.sln
          msbuild .\GMLoader\GMLoader.sln  /t:build /p:Configuration=Debug

