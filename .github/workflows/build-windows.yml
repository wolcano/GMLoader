name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      PROJECT_PATH: "GMLoader - xxHash\\GMLoader - xxHash.csproj"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Install Dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      #- name: "Restore packages"
      #  run: dotnet restore ${{ env.PROJECT_PATH }}
        
      #- name: "Build project"
      #  run: dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release
        
      - name: "Pack project"
        run: |
          cd
          dir ${{ env.PROJECT_PATH }}
          dir *.*
          dotnet build "${{ env.PROJECT_PATH }}" --configuration Release
          dotnet pack "${{ env.PROJECT_PATH }}" -p:PackageVersion=4.0.5 --no-restore --no-build --configuration Release --include-symbols --output lib\Standart.Hash.xxHash.dll
          dir lib\Standart.Hash.xxHash.dll

      - name: Setup MSBuild and add to PATH
        uses: microsoft/setup-msbuild@v1.0.0
        id: setup_msbuild
              
      - name: Run MSBuild
        id: run_msbuild
        run: |
          msbuild .\GMLoader\GMLoader.sln  /t:clean /p:Configuration=Debug
          nuget restore .\GMLoader\GMLoader.sln
          msbuild .\GMLoader\GMLoader.sln  /t:build /p:Configuration=Debug

